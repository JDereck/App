<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Tarefas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --alta:   #e53e3e;
      --media:  #dd6b20;
      --baixa:  #38a169;
      --bg:     #f7fafc;
      --card:   #ffffff;
      --borda:  #e2e8f0;
      --texto:  #2d3748;
      --mudo:   #718096;
    }

    body.escuro {
      --bg:    #1a202c;
      --card:  #2d3748;
      --borda: #4a5568;
      --texto: #f7fafc;
      --mudo:  #a0aec0;
    }
    body.escuro #banner-vencidas { background: #742a2a; border-color: #c53030; color: #fed7d7; }
    body.escuro .btn-secundario  { background: #4a5568; color: var(--texto); }

    #btn-modo-escuro {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 50%;
      width: 2.75rem;
      height: 2.75rem;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #btn-modo-escuro:hover { opacity: .85; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--texto);
      padding: 2rem 1rem;
    }

    h1 { text-align: center; margin-bottom: 2rem; font-size: 1.8rem; }

    /* ── Formulário ── */
    #card-formulario {
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 640px;
      margin: 0 auto 2rem;
    }
    #cabecalho-formulario {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    #cabecalho-formulario h2 { font-size: 1.2rem; margin: 0; }
    #seta-formulario { font-size: 1rem; color: var(--mudo); transition: transform .2s; }
    #seta-formulario.recolhido { transform: rotate(-90deg); }
    #corpo-formulario { margin-top: 1rem; }
    #corpo-formulario.oculto { display: none; }

    label {
      display: block;
      font-size: .875rem;
      font-weight: 600;
      margin-top: .85rem;
      margin-bottom: .25rem;
    }

    input[type="text"], select, textarea {
      width: 100%;
      padding: .5rem .75rem;
      border: 1px solid var(--borda);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--texto);
    }

    textarea { resize: vertical; min-height: 70px; }

    .linha-subtarefa { display: flex; gap: .5rem; margin-top: .5rem; }
    .linha-subtarefa input { flex: 1; }

    #lista-subtarefas-temp { list-style: none; margin-top: .5rem; }
    #lista-subtarefas-temp li {
      font-size: .875rem;
      padding: .2rem 0;
      color: var(--mudo);
    }
    #lista-subtarefas-temp li::before { content: '• '; }

    .btn {
      padding: .5rem 1.1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 600;
    }
    .btn:hover { opacity: .85; }
    .btn-secundario { background: #edf2f7; color: var(--texto); }
    .btn-primario {
      background: #3182ce;
      color: #fff;
      display: block;
      width: 100%;
      margin-top: 1.25rem;
      padding: .65rem;
      font-size: 1rem;
    }

    /* ── Lista de tarefas ── */
    #lista-tarefas {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-tarefa {
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 1.25rem;
      transition: opacity .2s;
    }
    .card-tarefa.concluida { opacity: .55; }

    .cabecalho-tarefa {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: .5rem;
    }

    .titulo-tarefa { font-size: 1.05rem; font-weight: 700; }
    .card-tarefa.concluida .titulo-tarefa { text-decoration: line-through; }

    .badge {
      font-size: .72rem;
      font-weight: 700;
      padding: .15rem .55rem;
      border-radius: 99px;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-Alta  { background: var(--alta); }
    .badge-Média { background: var(--media); }
    .badge-Baixa { background: var(--baixa); }

    .descricao-tarefa {
      font-size: .875rem;
      color: var(--mudo);
      margin-top: .35rem;
    }

    .secao-subtarefas {
      margin-top: .75rem;
      border-top: 1px solid var(--borda);
      padding-top: .65rem;
    }
    .secao-subtarefas h4 {
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--mudo);
      margin-bottom: .4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .contador-progresso {
      font-size: .8rem;
      font-weight: 700;
      color: var(--mudo);
    }
    .contador-progresso.completo { color: var(--baixa); }

    .item-subtarefa {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .9rem;
      margin-bottom: .25rem;
    }
    .item-subtarefa input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .badge-concluida {
      font-size: .85rem;
      color: var(--baixa);
      font-weight: 700;
      margin-top: .6rem;
    }

    .responsavel {
      font-size: .8rem;
      color: var(--mudo);
      margin-top: .2rem;
    }

    .data-vencimento {
      font-size: .8rem;
      color: var(--mudo);
      margin-top: .3rem;
    }
    .data-vencimento.vencida { color: var(--alta); font-weight: 700; }
    .data-vencimento.hoje    { color: var(--media); font-weight: 700; }

    .btn-excluir {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--mudo);
      font-size: 1.1rem;
      padding: .1rem .3rem;
      border-radius: 4px;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-excluir:hover { color: var(--alta); background: #fff5f5; }

    #status {
      text-align: center;
      color: var(--mudo);
      font-size: .9rem;
      margin-bottom: 1rem;
      min-height: 1.2em;
    }

    #barra-filtros {
      max-width: 640px;
      margin: 0 auto 1rem;
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
    }

    .btn-filtro {
      padding: .35rem .85rem;
      border: 1px solid var(--borda);
      border-radius: 99px;
      background: var(--card);
      color: var(--mudo);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-filtro:hover  { border-color: #a0aec0; color: var(--texto); }
    .btn-filtro.ativo  { background: var(--texto); color: #fff; border-color: var(--texto); }
    .btn-filtro.membro.ativo { background: #6b46c1; border-color: #6b46c1; }

    /* ── Gerenciador de membros ── */
    #card-membros {
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      max-width: 640px;
      margin: 0 auto 1.5rem;
    }
    #cabecalho-membros {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    #cabecalho-membros h2 { font-size: 1rem; margin: 0; color: var(--mudo); font-weight: 600; }
    #seta-membros { font-size: .85rem; color: var(--mudo); transition: transform .2s; }
    #seta-membros.recolhido { transform: rotate(-90deg); }
    #corpo-membros { margin-top: 1rem; }
    #corpo-membros.oculto { display: none; }

    .linha-membro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .4rem 0;
      border-bottom: 1px solid var(--borda);
      font-size: .95rem;
    }
    .linha-membro:last-child { border-bottom: none; }

    .linha-adicionar-membro { display: flex; gap: .5rem; margin-top: .75rem; }
    .linha-adicionar-membro input { flex: 1; }

    .btn-remover-membro {
      background: none;
      border: none;
      color: var(--mudo);
      cursor: pointer;
      font-size: 1rem;
      padding: .1rem .3rem;
      border-radius: 4px;
    }
    .btn-remover-membro:hover { color: var(--alta); }

    #lista-membros-gerenciar { margin-bottom: .25rem; }

    .separador-filtros {
      width: 1px;
      background: var(--borda);
      align-self: stretch;
      margin: .1rem 0;
    }

    /* ── Banner de vencidas ── */
    #banner-vencidas {
      display: none;
      max-width: 640px;
      margin: 0 auto 1rem;
      background: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 8px;
      padding: .75rem 1rem;
      color: var(--alta);
      font-weight: 600;
      font-size: .9rem;
      cursor: pointer;
    }
    #banner-vencidas:hover { background: #fed7d7; }

    /* ── Modal de edição ── */
    #overlay-edicao {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #overlay-edicao.aberto { display: flex; }
    #modal-edicao {
      background: var(--card);
      border-radius: 10px;
      padding: 1.5rem;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
    }
    #modal-edicao h2 { font-size: 1.1rem; margin-bottom: 1rem; }
    .modal-acoes { display: flex; gap: .75rem; margin-top: 1.25rem; }
    .modal-acoes .btn { flex: 1; }

    .btn-editar {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--mudo);
      font-size: 1rem;
      padding: .1rem .3rem;
      border-radius: 4px;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-editar:hover { color: #3182ce; background: #ebf8ff; }
  </style>
</head>
<body>

<button id="btn-modo-escuro" onclick="alternarModoEscuro()" title="Modo escuro">🌙</button>

<h1>Gerenciador de Tarefas</h1>

<!-- ── Gerenciador de Membros ── -->
<div id="card-membros">
  <div id="cabecalho-membros" onclick="alternarMembros()">
    <h2>Membros da Casa</h2>
    <span id="seta-membros">▼</span>
  </div>
  <div id="corpo-membros" class="oculto">
    <div id="lista-membros-gerenciar"></div>
    <div class="linha-adicionar-membro">
      <input type="text" id="inp-novo-membro" placeholder="Nome do membro" />
      <button class="btn btn-secundario" onclick="adicionarMembro()">Adicionar</button>
    </div>
  </div>
</div>

<!-- ── Formulário de criação ── -->
<div id="card-formulario">
  <div id="cabecalho-formulario" onclick="alternarFormulario()">
    <h2>Nova Tarefa</h2>
    <span id="seta-formulario">▼</span>
  </div>

  <div id="corpo-formulario">
  <label for="inp-titulo">Título *</label>
  <input type="text" id="inp-titulo" placeholder="Nome da tarefa" />

  <button type="button" id="btn-toggle-desc" class="btn btn-secundario" onclick="alternarDescricao()" style="margin-top:.75rem;font-size:.8rem;padding:.3rem .8rem">+ Adicionar descrição</button>
  <div id="bloco-descricao" style="display:none">
    <label for="inp-descricao" style="margin-top:.5rem">Descrição</label>
    <textarea id="inp-descricao" placeholder="Detalhes opcionais..."></textarea>
  </div>

  <label for="inp-prioridade">Prioridade</label>
  <select id="inp-prioridade">
    <option value="Alta">Alta</option>
    <option value="Média" selected>Média</option>
    <option value="Baixa">Baixa</option>
  </select>

  <label for="inp-responsavel">Responsável</label>
  <select id="inp-responsavel">
    <option value="">— Ninguém definido —</option>
  </select>

  <label for="inp-vencimento">Data de vencimento</label>
  <input type="date" id="inp-vencimento" />

  <label>Subtarefas</label>
  <div class="linha-subtarefa">
    <input type="text" id="inp-subtarefa" placeholder="Descrição da subtarefa" />
    <button class="btn btn-secundario" onclick="adicionarSubtarefa()">Adicionar</button>
  </div>
  <ul id="lista-subtarefas-temp"></ul>

  <button class="btn btn-primario" onclick="criarTarefa()">Criar Tarefa</button>
  </div><!-- fim #corpo-formulario -->
</div>

<!-- ── Filtros ── -->
<div id="barra-filtros">
  <button class="btn-filtro ativo" data-filtro="todos"     onclick="aplicarFiltro(this)">Todas</button>
  <button class="btn-filtro"       data-filtro="pendente"  onclick="aplicarFiltro(this)">Pendentes</button>
  <button class="btn-filtro"       data-filtro="concluida" onclick="aplicarFiltro(this)">Concluídas</button>
  <div class="separador-filtros"></div>
  <button class="btn-filtro"       data-filtro="Alta"      onclick="aplicarFiltro(this)">Alta</button>
  <button class="btn-filtro"       data-filtro="Média"     onclick="aplicarFiltro(this)">Média</button>
  <button class="btn-filtro"       data-filtro="Baixa"     onclick="aplicarFiltro(this)">Baixa</button>
  <div class="separador-filtros" id="sep-membros" style="display:none"></div>
  <span id="filtros-membros"></span>
</div>

<!-- ── Ordenação ── -->
<div style="max-width:640px;margin:0 auto .75rem;display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--mudo)">
  <span>Ordenar por:</span>
  <button class="btn-filtro ativo" id="ord-prioridade" onclick="trocarOrdem('prioridade')">Prioridade</button>
  <button class="btn-filtro"      id="ord-vencimento" onclick="trocarOrdem('vencimento')">Data</button>
</div>

<!-- ── Banner de tarefas vencidas ── -->
<div id="banner-vencidas" onclick="filtrarVencidas()"></div>

<!-- ── Modal de edição ── -->
<div id="overlay-edicao" onclick="fecharEdicao(event)">
  <div id="modal-edicao">
    <h2>Editar Tarefa</h2>

    <label for="edit-titulo">Título *</label>
    <input type="text" id="edit-titulo" />

    <label for="edit-prioridade">Prioridade</label>
    <select id="edit-prioridade">
      <option value="Alta">Alta</option>
      <option value="Média">Média</option>
      <option value="Baixa">Baixa</option>
    </select>

    <label for="edit-responsavel">Responsável</label>
    <select id="edit-responsavel">
      <option value="">— Ninguém definido —</option>
    </select>

    <label for="edit-vencimento">Data de vencimento</label>
    <input type="date" id="edit-vencimento" />

    <label for="edit-descricao">Descrição</label>
    <textarea id="edit-descricao" placeholder="Detalhes opcionais..."></textarea>

    <div class="modal-acoes">
      <button class="btn btn-secundario" onclick="fecharEdicao()">Cancelar</button>
      <button class="btn btn-primario" style="margin-top:0" onclick="salvarEdicao()">Salvar</button>
    </div>
  </div>
</div>

<!-- ── Lista de tarefas existentes ── -->
<div style="max-width:640px;margin:0 auto .5rem;display:flex;align-items:center;justify-content:space-between;">
  <div id="status" style="margin:0;min-height:1.2em"></div>
  <button class="btn btn-secundario" onclick="buscarTarefas()" style="font-size:.8rem;padding:.3rem .8rem">↻ Atualizar</button>
</div>
<div id="lista-tarefas"></div>

<script>
  // ================================================================
  // SUBSTITUA a URL abaixo pela URL do seu Apps Script implantado!
  // Exemplo: https://script.google.com/macros/s/SEU_ID/exec
  // ================================================================
  var SCRIPT_URL = 'COLE_SUA_URL_AQUI';

  // Buffer temporário de subtarefas antes de criar a tarefa
  var bufferSubtarefas = [];

  // Filtro ativo
  var filtroAtivo = 'todos';
  var ordemAtiva  = 'prioridade';

  function trocarOrdem(ord) {
    ordemAtiva = ord;
    document.getElementById('ord-prioridade').classList.toggle('ativo', ord === 'prioridade');
    document.getElementById('ord-vencimento').classList.toggle('ativo', ord === 'vencimento');
    renderizarTarefas(todasTarefasCache);
  }

  // Lista de membros carregada do servidor
  var membrosCache = [];

  // ── Formulário recolhível ────────────────────────────────────
  function alternarFormulario() {
    var corpo = document.getElementById('corpo-formulario');
    var seta  = document.getElementById('seta-formulario');
    var oculto = corpo.classList.toggle('oculto');
    seta.classList.toggle('recolhido', oculto);
  }

  function alternarDescricao() {
    var bloco = document.getElementById('bloco-descricao');
    var btn   = document.getElementById('btn-toggle-desc');
    var aberto = bloco.style.display === 'none';
    bloco.style.display = aberto ? '' : 'none';
    btn.textContent = aberto ? '− Remover descrição' : '+ Adicionar descrição';
  }

  function alternarModoEscuro() {
    var escuro = document.body.classList.toggle('escuro');
    document.getElementById('btn-modo-escuro').textContent = escuro ? '☀️' : '🌙';
    localStorage.setItem('modoEscuro', escuro ? '1' : '');
  }

  // Restaura preferência de modo escuro ao carregar
  if (localStorage.getItem('modoEscuro') === '1') {
    document.body.classList.add('escuro');
    document.getElementById('btn-modo-escuro').textContent = '☀️';
  }

  function alternarMembros() {
    var corpo = document.getElementById('corpo-membros');
    var seta  = document.getElementById('seta-membros');
    var oculto = corpo.classList.toggle('oculto');
    seta.classList.toggle('recolhido', oculto);
  }

  // ── Carregamento inicial ──────────────────────────────────────
  window.addEventListener('DOMContentLoaded', function() {
    buscarMembros().then(buscarTarefas);
  });

  // ── Buscar membros da casa ────────────────────────────────────
  async function buscarMembros() {
    try {
      var resposta = await fetch(SCRIPT_URL + '?acao=membros');
      if (!resposta.ok) return;
      membrosCache = await resposta.json();
      renderizarMembros();
    } catch (erro) {
      console.error('Erro ao carregar membros:', erro);
    }
  }

  function renderizarMembros() {
    // Atualiza lista no gerenciador
    var lista = document.getElementById('lista-membros-gerenciar');
    lista.innerHTML = '';
    membrosCache.forEach(function(m) {
      var linha = document.createElement('div');
      linha.className = 'linha-membro';

      var nome = document.createElement('span');
      nome.textContent = m.nome;

      var btn = document.createElement('button');
      btn.className   = 'btn-remover-membro';
      btn.title       = 'Remover ' + m.nome;
      btn.textContent = '✕';
      btn.addEventListener('click', function() {
        if (confirm('Remover ' + m.nome + ' da lista?')) removerMembro(m.id, linha);
      });

      linha.appendChild(nome);
      linha.appendChild(btn);
      lista.appendChild(linha);
    });

    if (membrosCache.length === 0) {
      lista.innerHTML = '<p style="color:var(--mudo);font-size:.875rem;margin-bottom:.5rem">Nenhum membro ainda.</p>';
    }

    // Atualiza select do formulário
    var sel = document.getElementById('inp-responsavel');
    var valorAtual = sel.value;
    sel.innerHTML = '<option value="">— Ninguém definido —</option>';
    membrosCache.forEach(function(m) {
      var opt = document.createElement('option');
      opt.value       = m.nome;
      opt.textContent = m.nome;
      if (m.nome === valorAtual) opt.selected = true;
      sel.appendChild(opt);
    });

    // Atualiza filtros de membros
    var zona = document.getElementById('filtros-membros');
    var sep  = document.getElementById('sep-membros');
    zona.innerHTML = '';
    if (membrosCache.length > 0) {
      sep.style.display = '';
      membrosCache.forEach(function(m) {
        var btn = document.createElement('button');
        btn.className        = 'btn-filtro membro';
        btn.dataset.filtro   = 'membro:' + m.nome;
        btn.textContent      = m.nome;
        btn.addEventListener('click', function() { aplicarFiltro(btn); });
        zona.appendChild(btn);
      });
    } else {
      sep.style.display = 'none';
    }
  }

  // ── Adicionar membro ──────────────────────────────────────────
  async function adicionarMembro() {
    var inp  = document.getElementById('inp-novo-membro');
    var nome = inp.value.trim();
    if (!nome) return;

    try {
      var resposta = await fetch(SCRIPT_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify({ acao: 'adicionarMembro', nome: nome })
      });
      var resultado = await resposta.json();
      if (resultado.erro) { alert(resultado.erro); return; }

      inp.value = '';
      membrosCache.push({ id: resultado.id, nome: resultado.nome });
      renderizarMembros();
    } catch (erro) {
      alert('Erro ao adicionar membro.');
      console.error(erro);
    }
  }

  // ── Remover membro ────────────────────────────────────────────
  async function removerMembro(id, linhaEl) {
    try {
      var resposta = await fetch(SCRIPT_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify({ acao: 'excluirMembro', id: id })
      });
      var resultado = await resposta.json();
      if (resultado.erro) { alert(resultado.erro); return; }

      membrosCache = membrosCache.filter(function(m) { return m.id !== id; });
      renderizarMembros();
    } catch (erro) {
      alert('Erro ao remover membro.');
      console.error(erro);
    }
  }

  // Permite adicionar subtarefa ou membro pressionando Enter
  document.getElementById('inp-subtarefa').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); adicionarSubtarefa(); }
  });
  document.getElementById('inp-novo-membro').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); adicionarMembro(); }
  });

  // ── Buscar tarefas do Google Sheets ──────────────────────────
  async function buscarTarefas() {
    definirStatus('Carregando tarefas...');
    try {
      var resposta = await fetch(SCRIPT_URL);
      if (!resposta.ok) throw new Error('Resposta inválida');
      var tarefas = await resposta.json();
      renderizarTarefas(tarefas);
      definirStatus('');
    } catch (erro) {
      definirStatus('Erro ao carregar. Verifique se a URL do script está correta.');
      console.error(erro);
    }
  }

  // ── Criar nova tarefa ─────────────────────────────────────────
  async function criarTarefa() {
    var titulo = document.getElementById('inp-titulo').value.trim();
    if (!titulo) {
      alert('O título da tarefa é obrigatório.');
      return;
    }

    var dados = {
      tarefa:      titulo,
      descricao:   document.getElementById('inp-descricao').value.trim(),
      prioridade:  document.getElementById('inp-prioridade').value,
      responsavel: document.getElementById('inp-responsavel').value.trim(),
      vencimento:  document.getElementById('inp-vencimento').value,
      subtarefas:  bufferSubtarefas.slice()
    };

    definirStatus('Salvando tarefa...');
    try {
      // Content-Type text/plain evita preflight CORS que o Apps Script não suporta.
      // O corpo continua sendo JSON válido e e.postData.contents lê corretamente.
      var resposta = await fetch(SCRIPT_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify(dados)
      });
      var resultado = await resposta.json();
      if (resultado.erro) throw new Error(resultado.erro);

      // Limpa o formulário
      document.getElementById('inp-titulo').value    = '';
      document.getElementById('inp-descricao').value = '';
      document.getElementById('bloco-descricao').style.display = 'none';
      document.getElementById('btn-toggle-desc').textContent   = '+ Adicionar descrição';
      document.getElementById('inp-prioridade').value  = 'Média';
      document.getElementById('inp-responsavel').value = '';
      document.getElementById('inp-vencimento').value  = '';
      document.getElementById('inp-responsavel').selectedIndex = 0;
      bufferSubtarefas = [];
      document.getElementById('lista-subtarefas-temp').innerHTML = '';

      await buscarTarefas();
    } catch (erro) {
      definirStatus('Erro ao salvar. Tente novamente.');
      console.error(erro);
    }
  }

  // ── Adicionar subtarefa ao buffer do formulário ───────────────
  function adicionarSubtarefa() {
    var inp = document.getElementById('inp-subtarefa');
    var valor = inp.value.trim();
    if (!valor) return;

    bufferSubtarefas.push(valor);
    inp.value = '';

    var li = document.createElement('li');
    li.textContent = valor;
    document.getElementById('lista-subtarefas-temp').appendChild(li);
    inp.focus();
  }

  // ── Filtros ───────────────────────────────────────────────────
  var todasTarefasCache = [];

  function aplicarFiltro(btn) {
    document.querySelectorAll('.btn-filtro').forEach(function(b) { b.classList.remove('ativo'); });
    btn.classList.add('ativo');
    filtroAtivo = btn.dataset.filtro;
    renderizarTarefas(todasTarefasCache);
  }

  // ── Renderizar todas as tarefas ───────────────────────────────
  function renderizarTarefas(tarefas) {
    todasTarefasCache = tarefas || [];
    atualizarBannerVencidas(todasTarefasCache);
    var lista = document.getElementById('lista-tarefas');
    lista.innerHTML = '';

    if (!tarefas || tarefas.length === 0) {
      lista.innerHTML = '<p style="text-align:center;color:var(--mudo)">Nenhuma tarefa ainda. Crie a primeira acima!</p>';
      return;
    }

    // Aplica filtro
    var visiveis = tarefas.filter(function(t) {
      if (filtroAtivo === 'todos')                    return true;
      if (filtroAtivo === 'pendente')                 return !t.concluido;
      if (filtroAtivo === 'concluida')                return t.concluido;
      if (filtroAtivo.indexOf('membro:') === 0)       return t.responsavel === filtroAtivo.slice(7);
      return t.prioridade === filtroAtivo;
    });

    if (visiveis.length === 0) {
      lista.innerHTML = '<p style="text-align:center;color:var(--mudo)">Nenhuma tarefa neste filtro.</p>';
      return;
    }

    var ordemPrioridade = { 'Alta': 0, 'Média': 1, 'Baixa': 2 };
    visiveis.sort(function(a, b) {
      if (ordemAtiva === 'vencimento') {
        var da = a.vencimento ? a.vencimento.slice(0, 10) : '9999';
        var db = b.vencimento ? b.vencimento.slice(0, 10) : '9999';
        return da < db ? -1 : da > db ? 1 : 0;
      }
      return (ordemPrioridade[a.prioridade] ?? 1) - (ordemPrioridade[b.prioridade] ?? 1);
    });

    visiveis.forEach(function(tarefa) {
      lista.appendChild(construirCardTarefa(tarefa));
    });
  }

  // ── Construir card de uma tarefa ──────────────────────────────
  function construirCardTarefa(tarefa) {
    var card = document.createElement('div');
    card.className = 'card-tarefa' + (tarefa.concluido ? ' concluida' : '');

    var subtarefas = Array.isArray(tarefa.subtarefas) ? tarefa.subtarefas : [];

    // Cabeçalho: título + badge de prioridade
    var cabecalho = document.createElement('div');
    cabecalho.className = 'cabecalho-tarefa';

    var titulo = document.createElement('span');
    titulo.className = 'titulo-tarefa';
    titulo.textContent = tarefa.tarefa;

    var badge = document.createElement('span');
    badge.className = 'badge badge-' + tarefa.prioridade;
    badge.textContent = tarefa.prioridade;

    var btnEditar = document.createElement('button');
    btnEditar.className   = 'btn-editar';
    btnEditar.title       = 'Editar tarefa';
    btnEditar.textContent = '✎';
    btnEditar.addEventListener('click', function() { abrirEdicao(tarefa); });

    var btnExcluir = document.createElement('button');
    btnExcluir.className   = 'btn-excluir';
    btnExcluir.title       = 'Excluir tarefa';
    btnExcluir.textContent = '✕';
    btnExcluir.addEventListener('click', function() {
      if (confirm('Excluir a tarefa "' + tarefa.tarefa + '"?')) {
        excluirTarefa(tarefa.id, card);
      }
    });

    cabecalho.appendChild(titulo);
    cabecalho.appendChild(badge);
    cabecalho.appendChild(btnEditar);
    cabecalho.appendChild(btnExcluir);
    card.appendChild(cabecalho);

    // Responsável (se houver)
    if (tarefa.responsavel) {
      var respEl = document.createElement('p');
      respEl.className   = 'responsavel';
      respEl.textContent = '👤 ' + tarefa.responsavel;
      card.appendChild(respEl);
    }

    // Data de vencimento (se houver)
    if (tarefa.vencimento) {
      var dataEl = document.createElement('p');
      dataEl.className = 'data-vencimento';
      var hoje     = new Date().toISOString().slice(0, 10);
      var venc     = tarefa.vencimento.slice(0, 10);
      var partes   = venc.split('-');
      var dataFormatada = partes[2] + '/' + partes[1] + '/' + partes[0];
      if (venc < hoje) {
        dataEl.classList.add('vencida');
        dataEl.textContent = '⚠ Venceu em ' + dataFormatada;
      } else if (venc === hoje) {
        dataEl.classList.add('hoje');
        dataEl.textContent = '⏰ Vence hoje';
      } else {
        dataEl.textContent = '📅 Vence em ' + dataFormatada;
      }
      card.appendChild(dataEl);
    }

    // Descrição (se houver)
    if (tarefa.descricao) {
      var desc = document.createElement('p');
      desc.className = 'descricao-tarefa';
      desc.textContent = tarefa.descricao;
      card.appendChild(desc);
    }

    // Subtarefas com checkboxes
    if (subtarefas.length > 0) {
      var secao = document.createElement('div');
      secao.className = 'secao-subtarefas';

      var h4 = document.createElement('h4');

      var spanLabel = document.createElement('span');
      spanLabel.textContent = 'Subtarefas';

      var spanContador = document.createElement('span');
      spanContador.className = 'contador-progresso';
      spanContador.id = 'contador-' + tarefa.id;
      var marcadas = tarefa.concluido ? subtarefas.length : 0;
      spanContador.textContent = marcadas + '/' + subtarefas.length;
      if (marcadas === subtarefas.length) spanContador.classList.add('completo');

      h4.appendChild(spanLabel);
      h4.appendChild(spanContador);
      secao.appendChild(h4);

      subtarefas.forEach(function(sub, idx) {
        var item = document.createElement('div');
        item.className = 'item-subtarefa';

        var cb = document.createElement('input');
        cb.type    = 'checkbox';
        cb.id      = 'cb-' + tarefa.id + '-' + idx;
        cb.checked = tarefa.concluido;
        cb.addEventListener('change', function() {
          verificarConclusao(card, secao, tarefa.id);
        });

        var lbl = document.createElement('label');
        lbl.htmlFor     = cb.id;
        lbl.textContent = sub;

        item.appendChild(cb);
        item.appendChild(lbl);
        secao.appendChild(item);
      });

      card.appendChild(secao);
    }

    // Badge de concluída (se já estiver concluída ao carregar)
    if (tarefa.concluido) {
      card.appendChild(criarBadgeConcluida());
    }

    return card;
  }

  // ── Verificar se a tarefa deve ser marcada como concluída ─────
  // A tarefa SÓ fica concluída quando TODAS as subtarefas estão marcadas.
  function verificarConclusao(card, secao, id) {
    var checkboxes = Array.from(secao.querySelectorAll('input[type="checkbox"]'));
    var marcadas      = checkboxes.filter(function(cb) { return cb.checked; }).length;
    var todasMarcadas = marcadas === checkboxes.length;

    // Atualiza contador
    var contador = document.getElementById('contador-' + id);
    if (contador) {
      contador.textContent = marcadas + '/' + checkboxes.length;
      contador.classList.toggle('completo', todasMarcadas);
    }

    if (todasMarcadas) {
      card.classList.add('concluida');
      if (!card.querySelector('.badge-concluida')) {
        card.appendChild(criarBadgeConcluida());
      }
    } else {
      card.classList.remove('concluida');
      var existente = card.querySelector('.badge-concluida');
      if (existente) existente.remove();
    }

    salvarConclusao(id, todasMarcadas);
  }

  // ── Banner de tarefas vencidas ───────────────────────────────
  function atualizarBannerVencidas(tarefas) {
    var hoje    = new Date().toISOString().slice(0, 10);
    var vencidas = tarefas.filter(function(t) {
      return !t.concluido && t.vencimento && t.vencimento.slice(0, 10) < hoje;
    });
    var banner = document.getElementById('banner-vencidas');
    if (vencidas.length > 0) {
      banner.style.display = '';
      banner.textContent   = '⚠ ' + vencidas.length + ' tarefa' + (vencidas.length > 1 ? 's' : '') + ' vencida' + (vencidas.length > 1 ? 's' : '') + ' — clique para ver';
    } else {
      banner.style.display = 'none';
    }
  }

  function filtrarVencidas() {
    var btn = document.querySelector('.btn-filtro[data-filtro="pendente"]');
    if (btn) { aplicarFiltro(btn); }
    window.scrollTo({ top: document.getElementById('lista-tarefas').offsetTop - 20, behavior: 'smooth' });
  }

  // ── Modal de edição ──────────────────────────────────────────
  var tarefaEmEdicao = null;

  function abrirEdicao(tarefa) {
    tarefaEmEdicao = tarefa;

    document.getElementById('edit-titulo').value      = tarefa.tarefa     || '';
    document.getElementById('edit-prioridade').value  = tarefa.prioridade || 'Média';
    document.getElementById('edit-vencimento').value  = (tarefa.vencimento || '').slice(0, 10);
    document.getElementById('edit-descricao').value   = tarefa.descricao  || '';

    // Popula select de responsável com membros atuais
    var sel = document.getElementById('edit-responsavel');
    sel.innerHTML = '<option value="">— Ninguém definido —</option>';
    membrosCache.forEach(function(m) {
      var opt = document.createElement('option');
      opt.value = m.nome; opt.textContent = m.nome;
      if (m.nome === tarefa.responsavel) opt.selected = true;
      sel.appendChild(opt);
    });

    document.getElementById('overlay-edicao').classList.add('aberto');
    document.getElementById('edit-titulo').focus();
  }

  function fecharEdicao(evt) {
    if (evt && evt.target !== document.getElementById('overlay-edicao')) return;
    document.getElementById('overlay-edicao').classList.remove('aberto');
    tarefaEmEdicao = null;
  }

  async function salvarEdicao() {
    if (!tarefaEmEdicao) return;
    var titulo = document.getElementById('edit-titulo').value.trim();
    if (!titulo) { alert('O título é obrigatório.'); return; }

    var dados = {
      acao:        'editar',
      id:          tarefaEmEdicao.id,
      tarefa:      titulo,
      prioridade:  document.getElementById('edit-prioridade').value,
      responsavel: document.getElementById('edit-responsavel').value,
      vencimento:  document.getElementById('edit-vencimento').value,
      descricao:   document.getElementById('edit-descricao').value.trim(),
      subtarefas:  tarefaEmEdicao.subtarefas
    };

    try {
      var resposta = await fetch(SCRIPT_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify(dados)
      });
      var resultado = await resposta.json();
      if (resultado.erro) throw new Error(resultado.erro);

      document.getElementById('overlay-edicao').classList.remove('aberto');
      tarefaEmEdicao = null;
      await buscarTarefas();
    } catch (erro) {
      alert('Erro ao salvar edição.');
      console.error(erro);
    }
  }

  // Remove a tarefa da planilha e do DOM
  async function excluirTarefa(id, card) {
    try {
      var resposta = await fetch(SCRIPT_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify({ acao: 'excluir', id: id })
      });
      var resultado = await resposta.json();
      if (resultado.erro) throw new Error(resultado.erro);
      card.remove();
      var lista = document.getElementById('lista-tarefas');
      if (!lista.querySelector('.card-tarefa')) {
        lista.innerHTML = '<p style="text-align:center;color:var(--mudo)">Nenhuma tarefa ainda. Crie a primeira acima!</p>';
      }
    } catch (erro) {
      alert('Erro ao excluir. Tente novamente.');
      console.error(erro);
    }
  }

  // Envia atualização de conclusão para a planilha
  async function salvarConclusao(id, concluido) {
    try {
      await fetch(SCRIPT_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify({ acao: 'concluir', id: id, concluido: concluido })
      });
    } catch (erro) {
      console.error('Erro ao salvar conclusão:', erro);
    }
  }

  function criarBadgeConcluida() {
    var p = document.createElement('p');
    p.className   = 'badge-concluida';
    p.textContent = '✓ Concluída';
    return p;
  }

  // ── Atualizar mensagem de status ──────────────────────────────
  function definirStatus(msg) {
    document.getElementById('status').textContent = msg;
  }
</script>
</body>
